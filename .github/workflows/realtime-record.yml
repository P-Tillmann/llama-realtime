# Fork-only: records reference sessions from the OpenAI Realtime API into tools/realtime-harness/fixtures/openai
# and commits them to the branch the workflow runs on. Needs the repository secret OPEN_AI_KEY.
name: Realtime - record OpenAI fixtures

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenAI realtime model'
        required: false
        default: 'gpt-realtime'
        type: string
      scenarios:
        description: 'Space-separated scenario names (empty = all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: realtime-record-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    if: github.repository != 'ggml-org/llama.cpp'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install harness dependencies
        run: pip install -r tools/realtime-harness/requirements.txt

      - name: Record
        working-directory: tools/realtime-harness
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
          MODEL: ${{ inputs.model }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::The repository secret OPEN_AI_KEY is missing or empty (Settings > Secrets and variables > Actions > Repository secrets)"
            exit 1
          fi
          args=()
          for s in $SCENARIOS; do args+=(--scenario "$s"); done
          set +e
          python harness.py record --target openai --model "$MODEL" --out fixtures/openai --strict "${args[@]}" | tee record.log
          rc=${PIPESTATUS[0]}
          { echo '```'; cat record.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/realtime-harness/fixtures/openai
          if git diff --cached --quiet; then
            echo "fixtures unchanged"
          else
            git commit -m "realtime-harness : record OpenAI fixtures (${{ inputs.model }})"
            git push
          fi
